[package]
name = "xml2po"
version = "0.1.0"
edition = "2024"
description = "Generic XML/HTML to PO file converter with format-specific strategies"

[dependencies]
quick-xml = { version = "0.30", features = ["encoding", "serialize"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }

clap = { version = "4.0", features = ["derive"] }
regex = "1.12.2"
rspolib = "0.1.1"
[features]
default = ["mjml", "chrono"]
mjml = []
html = []
chrono=[]
wasm32=[]
rspolib=[]
all = ["mjml", "html", "chrono", "rspolib"]
