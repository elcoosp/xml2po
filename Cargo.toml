[package]
name = "xml2po"
version = "0.3.0"
edition = "2024"
rust-version = "1.86"
description = "XML/HTML/MJML to PO (gettext) converter with inline markup placeholders, translate-attribute awareness, lossless PO catalogs, XLIFF 1.2 bridge and a CI-friendly CLI"
authors = ["elcoosp"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/elcoosp/xml2po"
homepage = "https://github.com/elcoosp/xml2po"
documentation = "https://docs.rs/xml2po"
keywords = ["i18n", "gettext", "po", "xliff", "mjml"]
categories = ["localization", "command-line-utilities", "parser-implementations"]
include = ["src/**", "tests/**", "docs/**", "examples/**", "README.md", "LICENSE", "CHANGELOG.md"]

[lib]
name = "xml2po"
path = "src/lib.rs"

[[bin]]
name = "xml2po"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
quick-xml = "0.42.0"
thiserror = "2.0.17"

# Optional library dependencies
chrono = { version = "0.4.45", default-features = false, features = ["clock"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }

# CLI-only dependencies (behind the `cli` feature so library builds stay lean)
clap = { version = "4.6.7", features = ["derive"], optional = true }
rayon = { version = "1.11.0", optional = true }
encoding_rs = { version = "0.8.35", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
serde = { version = "1.0.229", features = ["derive"] }

# The CLI integration tests need the binary and the encoding helper.
[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli", "cli-encoding", "chrono", "mjml", "html", "xml"]

[dev-dependencies]
tempfile = "3.23.0"
serde_json = "1.0.145"

[features]
default = ["cli", "mjml", "html", "xml", "chrono", "parallel", "cli-encoding", "xliff"]
# Format strategies
mjml = []
html = []
xml = []
# Library features
chrono = ["dep:chrono"]
serde = ["dep:serde"]
xliff = []
# CLI features
cli = ["dep:clap"]
parallel = ["dep:rayon", "cli"]
cli-encoding = ["dep:encoding_rs", "cli"]
all = ["mjml", "html", "xml", "chrono", "serde", "cli", "parallel", "cli-encoding", "xliff"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
