[package]
name = "mjml2po"
version = "0.1.0"
edition = "2024"

[dependencies]
quick-xml = { version = "0.30", features = ["encoding", "serialize"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }

clap = { version = "4.0", features = ["derive"] }
regex = "1.12.2"
rspolib = "0.1.1"
[features]
default = ["quick-xml/encoding", "quick-xml/serialize"]
