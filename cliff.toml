# git-cliff configuration: conventional commits → Keep a Changelog.
# https://git-cliff.org
[changelog]
# Match the crate version in Cargo.toml.
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
# Tera template rendering one release section.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first | split(pat="\n") | first | trim }}
{% endfor %}
{% endfor %}
"""
postprocessors = []

[git]
# Parse commits that follow the Conventional Commits specification.
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^refactor", group = "Changed" },
  { message = "^style", group = "Changed" },
  { message = "^chore", group = "Internal" },
  { message = "^ci", group = "Internal" },
  { message = "^build", group = "Internal" },
  { message = ".*", group = "Changed", default_scope = "other" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[remote]
# Contributor/PR metadata requires GitHub API access; keep changelog
# generation fully local and reproducible without a token.
github = { owner = "elcoosp", repo = "xml2po", remote = "origin", metadata = false }
